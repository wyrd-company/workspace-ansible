name: project
description: Setup a project folder in the workspace

requires:
  - git
  - program: git-automation
    hint: Installed by workspace-ansible; apply this template inside a workspace container
  - program: ensure-t3-project
    hint: Installed by workspace-ansible; apply this template inside a workspace container

interview:
  - id: project
    computed: "toha_target_name"
  
  - id: proceed
    type: confirm
    prompt: "Proceed setting up project {{project}}?"
    default: true

  - flow: stop
    when: "not proceed"
    label: "Declined to setup {{project}}"

  - id: remote
    type: git
    prompt: Project remote URL (empty for none)

  - message: "Checking out or creating {{project}} memory..."
  - hook:
      script: scripts/ensure-worktree
      args:
        - "/repos/memory.git"
        - "{{project}}"
        - "memory"

  - hook:
      script: scripts/ensure-memory-gitignore
      args:
        - "memory"

  - message: "Checking out or creating {{project}} tasks..."
  - hook:
      script: scripts/ensure-worktree
      args:
        - "/repos/tasks.git"
        - "{{project}}"
        - "tasks"

  - message: "Registering {{project}} as a T3 Code project..."
  - hook:
      run:
        - ensure-t3-project
        - --workspace
        - "."
        - "{{project}}"

messages:
  after-apply: |
    {{project}} setup complete.

    T3 Code has a project for this folder, named for the workspace and {{project}}.
    Give it an icon that fits the project: a Lucide icon, or an emoji or a
    monogram when no Lucide icon fits. An agent sets it with the T3 tool
    `t3_project_update` (`projectIcon`); the T3 Code app can set it too.

    Use the toha `repo` template to add repos to the project.
