name: repo
description: Setup a repo clone in the product folder

requires:
  - git
  - program: git-automation
    hint: Installed by workspace-ansible; apply this template inside a workspace container
  - program: ensure-t3-project
    hint: Installed by workspace-ansible; apply this template inside a workspace container

interview:
  - id: repo
    computed: "toha_target_name"

  - id: org
    type: text
    prompt: GitHub Organization or Account
    description: The organization or account on GitHub that holds the repo
    placeholder: org
    required: true

  - id: fork
    type: confirm
    prompt: Is this a fork?
    default: false

  - id: proceed
    type: confirm
    prompt: "Proceed setting up repo {{org}}/{{repo}}?"
    default: true

  - flow: stop
    when: "not proceed"
    label: "Declined to setup {{org}}/{{repo}}"

  - id: branch
    computed: "'fork' if fork else 'main'"

  - message: "Bare cloning {{org}}/{{repo}} and adding the {{branch}} worktree..."
  - hook:
      script: scripts/ensure-clone
      args:
        - "git@github.com:{{org}}/{{repo}}.git"
        - "{{repo}}.git"
        - "{{branch}}"

  - message: "Registering {{repo}} as a T3 Code project..."
  - hook:
      run:
        - ensure-t3-project
        - --icon-from
        - "{{branch}}"
        - "."
        - "{{repo}}"

messages:
  after-apply: |
    {{org}}/{{repo}} setup complete.

    T3 Code has a project for this folder, named {{repo}}. When the {{branch}} worktree ships an icon, t3.json here points the project at it. When it does not, give the project an icon that fits the repository: a Lucide icon, or an emoji or a monogram when no Lucide icon fits. An agent sets it with the T3 tool `t3_project_update` (`projectIcon`); the T3 Code app can set it too.

    Update the {{repo}}/AGENTS.md with some quick info about the repo that was cloned, pointing to {{repo}}/main/AGENTS.md for more details.

    - Add this repo to the ../AGENTS.md tree.
    - Create a ../references/{{repo}} folder

    Be sure to commit your changes when you are done.