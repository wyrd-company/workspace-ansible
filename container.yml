---
- name: System-Wide (/etc) and User Environment Setup
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # Git over HTTPS as wyrd-automation[bot], for this playbook, for Dagu (templates/etc/dagu/base.yml.j2), and
    # for `git automation` (templates/usr/local/bin/git-automation.j2).
    # Remotes are SSH URLs for humans and agents, who use them through `git <handle>` or a T3 thread's registered
    # operator (`git operator`, workspace-dotfiles); the bot is a GitHub App, which has no SSH, so automation
    # rewrites them to HTTPS. None of this is in ~/.gitconfig. Never add GIT_OPERATOR here: Dagu sets it on its own
    # (base.yml.j2), and git-automation exporting it would loop through the git shim.
    automation_git_env:
      GH_LOGIN: "wyrd-automation[bot]"
      GIT_CONFIG_COUNT: "3"
      GIT_CONFIG_KEY_0: "credential.https://github.com.helper"
      GIT_CONFIG_VALUE_0: "/usr/local/bin/git-credential-automation"
      GIT_CONFIG_KEY_1: "credential.https://github.com.useHttpPath"
      GIT_CONFIG_VALUE_1: "true"
      GIT_CONFIG_KEY_2: "url.https://github.com/.insteadOf"
      GIT_CONFIG_VALUE_2: "git@github.com:"
      GIT_AUTHOR_NAME: "wyrd-automation[bot]"
      GIT_AUTHOR_EMAIL: "350608332+wyrd-automation[bot]@users.noreply.github.com"
      GIT_COMMITTER_NAME: "wyrd-automation[bot]"
      GIT_COMMITTER_EMAIL: "350608332+wyrd-automation[bot]@users.noreply.github.com"

    # The Wyrd plugin marketplace, kept up to date by every run of this playbook. Claude Code
    # (managed-settings.json) and Codex (config.toml) read it as a local marketplace, so no session
    # clones it at startup.
    agent_marketplace_repo: https://github.com/wyrd-company/agent-marketplace.git
    agent_marketplace_dir: /usr/local/share/agent-marketplace

  tasks:
    - name: Load variables from workspace options
      ansible.builtin.include_vars:
        file: /etc/workspace/config.yml

    # Fork overlay (docs/fork-overlay.md). Upstream never commits under fork/, so a fork's files
    # there never conflict with a sync. All three paths are optional.
    - name: Look for the fork overlay
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/fork/{{ item }}"
      loop:
        - vars.yml
        - templates/etc
        - tasks
      register: fork_overlay

    # After the workspace options, so a fork's vars override them
    - name: Load the fork's variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/fork/vars.yml"
      when: fork_overlay.results[0].stat.exists

    - name: Apply system-wide configurations as root
      become: true
      vars:
        template_root: "{{ playbook_dir }}/templates/etc"
        fork_template_root: "{{ playbook_dir }}/fork/templates/etc"
      block:
        - name: Find all template files locally
          ansible.builtin.find:
            paths: "{{ template_root }}"
            recurse: true
            patterns: "*.j2"
          delegate_to: localhost
          become: false
          register: template_files

        - name: Find the fork's template files locally
          ansible.builtin.find:
            paths: "{{ fork_template_root }}"
            recurse: true
            patterns: "*.j2"
          delegate_to: localhost
          become: false
          when: fork_overlay.results[1].stat.exists
          register: fork_template_files

        # Source file by path relative to templates/etc. A fork template with the same relative path
        # replaces the upstream one: the upstream file is never rendered, so the result does not depend
        # on the order of the renders.
        - name: Choose the template for each file under /etc
          ansible.builtin.set_fact:
            etc_templates: >-
              {{ dict(template_files.files | map(attribute='path') | map('relpath', template_root)
                      | zip(template_files.files | map(attribute='path')))
                 | combine(dict((fork_template_files.files | default([])) | map(attribute='path')
                      | map('relpath', fork_template_root)
                      | zip((fork_template_files.files | default([])) | map(attribute='path')))) }}

        - name: Ensure target subdirectories exist under /etc
          ansible.builtin.file:
            path: "/etc/{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop: "{{ etc_templates | dict2items | map(attribute='key') | map('dirname') | select | unique | sort }}"

        - name: Render and deploy templates to /etc
          ansible.builtin.template:
            src: "{{ item.value }}"
            dest: "/etc/{{ item.key | regex_replace('\\.j2$', '') }}"
            owner: root
            group: root
            mode: '0644'
          loop: "{{ etc_templates | dict2items | sort(attribute='key') }}"
          loop_control:
            label: "{{ item.key }}"
          register: rendered_templates

        # Trowel rereads its configuration on its own only while it can watch the file, and a
        # container that has run out of inotify instances cannot. At startup trowel is not running
        # yet (it waits for ansible-setup), so reload only a supervised service.
        - name: Reload trowel when its configuration changed
          ansible.builtin.shell:
            cmd: |
              if /command/s6-svok /run/service/trowel; then
                /command/s6-svc -h /run/service/trowel
              fi
          when: >-
            rendered_templates.results | selectattr('changed')
            | map(attribute='dest') | select('match', '/etc/trowel/') | list | length > 0

        # Caddy watches /etc/caddy/system.d, but reloading explicitly covers containers
        # that hit inotify limits and skips older images without the system.d import.
        - name: Reload caddy when its configuration changed
          ansible.builtin.shell:
            cmd: |
              if [ -S /run/caddy/admin.sock ] && grep -q '/etc/caddy/system\.d/' /etc/caddy/Caddyfile 2>/dev/null; then
                /usr/local/bin/caddy-reload
              fi
          when: >-
            rendered_templates.results | selectattr('changed')
            | map(attribute='dest') | select('match', '/etc/caddy/') | list | length > 0

        # On PATH, so `git automation <cmd>` works; the hooks of the toha templates use it
        - name: Install git-automation
          ansible.builtin.template:
            src: templates/usr/local/bin/git-automation.j2
            dest: /usr/local/bin/git-automation
            owner: root
            group: root
            mode: '0755'

        - name: Install the Xolotl MCP header helper
          ansible.builtin.template:
            src: templates/usr/local/bin/xolotl-mcp-headers.j2
            dest: /usr/local/bin/xolotl-mcp-headers
            owner: root
            group: root
            mode: '0755'

        - name: Install the Xolotl API key helper
          ansible.builtin.template:
            src: templates/usr/local/bin/xolotl-api-key.j2
            dest: /usr/local/bin/xolotl-api-key
            owner: root
            group: root
            mode: '0755'

        # Before the harness configs are used: both read the plugins from this checkout. Public, over HTTPS.
        - name: Check out the Wyrd plugin marketplace
          ansible.builtin.git:
            repo: "{{ agent_marketplace_repo }}"
            dest: "{{ agent_marketplace_dir }}"
            version: main
            depth: 1
            update: true

        - name: Install the automation credential helper
          ansible.builtin.copy:
            src: templates/usr/local/bin/git-credential-automation
            dest: /usr/local/bin/git-credential-automation
            owner: root
            group: root
            mode: '0755'

        # On PATH: the hooks of the toha templates register project and repo folders as T3 Code projects
        - name: Install ensure-t3-project
          ansible.builtin.copy:
            src: templates/usr/local/bin/ensure-t3-project
            dest: /usr/local/bin/ensure-t3-project
            owner: root
            group: root
            mode: '0755'

        # Trowel runs it for deck activity (templates/etc/trowel/config.yml.j2) to wake T3 Code threads
        - name: Install deck-wake-t3
          ansible.builtin.copy:
            src: templates/usr/local/bin/deck-wake-t3
            dest: /usr/local/bin/deck-wake-t3
            owner: root
            group: root
            mode: '0755'

        # The homelab CA is bind-mounted read-only into /usr/local/share/ca-certificates at run time, so the image's
        # trust store does not have it. Every start and every ansible-sync rebuilds the store from that directory.
        - name: Refresh the CA trust store
          ansible.builtin.command:
            argv:
              - update-ca-certificates
          register: ca_certificates
          changed_when: "'0 added, 0 removed' not in ca_certificates.stdout"

    - name: Apply system-wide configurations as vscode
      become: true
      become_user: vscode
      block:
        # Cargo ===============================================================

        # Parallel agent builds saturated the CPU. CARGO_HOME (/usr/local/cargo) is a bind mount of the host's shared
        # cargo cache, so this one file caps every workspace on the host and survives rebuilds; ~/.cargo/config.toml
        # would apply only to builds under the home folder. Cargo never writes this file, so the playbook owns it.
        # Workspaces without the rust feature have no cargo home, so the cap is skipped there.
        - name: Look for the cargo home
          ansible.builtin.stat:
            path: "{{ lookup('env', 'CARGO_HOME') | default('/usr/local/cargo', true) }}"
          register: cargo_home

        - name: Cap parallel cargo build jobs
          when: cargo_home.stat.isdir | default(false)
          ansible.builtin.copy:
            dest: "{{ cargo_home.stat.path }}/config.toml"
            mode: '0644'
            content: |
              # Managed by workspace-ansible (container.yml); edits here are overwritten.
              # Caps parallel compile jobs: agents build at once on a shared host.
              # Override for one build with `-j N` or `CARGO_BUILD_JOBS=N`.
              [build]
              jobs = 4

        # GitHub CLI ==========================================================

        - name: Install or upgrade gh-vault-agent-app-token
          ansible.builtin.include_tasks: tasks/install_gh_vault_agent_app_token.yml

        # Dotfiles ============================================================

        - name: Clone dotfiles
          ansible.builtin.command:
            argv:
              - chezmoi
              - init
              - "{{dotfiles_repo}}"
            creates: /home/vscode/.local/share/chezmoi/.git
        - name: Apply dotfiles
          ansible.builtin.command:
            argv:
              - chezmoi
              - update
              - --init
          environment:
            BAO_ADDR: "{{ lookup('env', 'BAO_ADDR') }}"
            # sudo resets PATH to secure_path; the run_ scripts need the container's (brew, node)
            PATH: "{{ lookup('env', 'PATH') }}"
            NPM_CONFIG_PREFIX: "{{ lookup('env', 'NPM_CONFIG_PREFIX') }}"
            # run_after_gh-extensions.sh installs and upgrades extensions as the bot
            GH_LOGIN: "{{ automation_git_env.GH_LOGIN }}"
            # Not in a repository, so the shim can't take the owner from a remote
            GH_OWNER: "{{org}}"

        # Repos run after the dotfiles: the gh shim and its app-token config come from them
        - name: Clone and check out repositories as wyrd-automation[bot]
          # PATH as in "Apply dotfiles": init_local_workflows.yml runs toha from brew
          environment: "{{ automation_git_env | combine({'BAO_ADDR': lookup('env', 'BAO_ADDR'), 'PATH': lookup('env', 'PATH')}) }}"
          block:
            # Repos ===========================================================
            - name: Clone memory
              ansible.builtin.include_tasks: tasks/clone_bare_git.yml
              vars:
                repo: memory

            - name: Clone tasks
              ansible.builtin.include_tasks: tasks/clone_bare_git.yml
              vars:
                repo: tasks

            - name: Clone workflows
              ansible.builtin.include_tasks: tasks/clone_bare_git.yml
              vars:
                repo: workflows

            # Tasks ===========================================================

            - name: Checkout {{workspace}} tasks
              ansible.builtin.include_tasks: tasks/clone_or_create_branch.yml
              vars:
                repo: tasks
                branch: "workspace/{{workspace}}"
                remote: "origin"
                worktree: "/tasks"

            # Workflows =======================================================

            - name: Checkout main workflows
              ansible.builtin.include_tasks: tasks/clone_or_create_branch.yml
              vars:
                repo: workflows
                branch: "main"
                remote: "origin"
                worktree: "/workflows/main"

            - name: Checkout {{workspace}} workflows
              ansible.builtin.include_tasks: tasks/clone_or_create_branch.yml
              vars:
                repo: workflows
                branch: "workspace/{{workspace}}"
                remote: "origin"
                worktree: "/workflows/local"
                init_task: tasks/init_local_workflows.yml

    # After the dotfiles: the install runs toha from brew
    - name: Install toha templates as root
      become: true
      environment:
        PATH: "{{ lookup('env', 'PATH') }}"
      block:
        - name: Install toha templates
          ansible.builtin.include_tasks: tasks/install_toha_templates.yml
          vars:
            toha_templates:
              - project
              - repo

    # The fork's tasks run last, when everything above is in place. They set their own become.
    - name: Find the fork's tasks
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/fork/tasks"
        patterns: "*.yml"
      when: fork_overlay.results[2].stat.exists
      register: fork_task_files

    - name: Run the fork's tasks
      ansible.builtin.include_tasks: "{{ item }}"
      loop: "{{ (fork_task_files.files | default([])) | map(attribute='path') | sort }}"

  # 3. HANDLERS
  # Handlers only run if a task in step 1 actually changes a file
  handlers:
    - name: Restart sshd
      become: true
      ansible.builtin.service:
        name: ssh
        state: restarted
